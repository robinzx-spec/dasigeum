<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>이용약관 | 다시금</title><style>body{max-width:760px;margin:50px auto;padding:0 22px;font-family:system-ui;line-height:1.8;color:#49382f}a{color:#8a6410}</style><h1>다시금 이용약관</h1><p>현재 다시금은 정식 출시 준비 중입니다. 회원, 포인트, 제휴 쇼핑, 출금, 서비스 이용 제한 등 실제 운영 조건이 확정되면 그 내용에 맞춘 정식 이용약관을 시행일과 함께 공개합니다.</p><p>현재 페이지는 서비스 등록 및 출시 준비를 위한 안내 페이지이며 확정되지 않은 조건을 약관으로 표시하지 않습니다.</p><p><a href="./">← 다시금 홈</a></p>
