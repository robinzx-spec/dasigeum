<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>계정 삭제 안내 | 다시금</title><style>body{max-width:760px;margin:50px auto;padding:0 22px;font-family:system-ui;line-height:1.8;color:#49382f}a{color:#8a6410}</style><h1>계정 삭제 안내</h1><p>다시금은 정식 출시 전 계정 삭제 절차를 앱과 공식 웹페이지에서 명확하게 제공할 예정입니다.</p><p>삭제 요청 방식과 삭제·보존되는 데이터의 범위는 실제 운영 및 법적 보존 의무를 반영해 정식 출시 전에 이 페이지에 안내합니다.</p><p><a href="./">← 다시금 홈</a></p>
