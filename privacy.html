<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>개인정보처리방침 | 다시금</title><style>body{max-width:760px;margin:50px auto;padding:0 22px;font-family:system-ui;line-height:1.8;color:#49382f}a{color:#8a6410}</style><h1>개인정보처리방침</h1><p>다시금은 서비스 제공에 필요한 범위에서 개인정보를 처리하며, 관련 법령과 서비스 정책에 따라 안전하게 관리합니다.</p><h2>출시 준비 안내</h2><p>현재 정식 출시 준비 중이며, 실제 수집 항목·보유기간·처리위탁·제3자 제공·개인정보 보호책임자 및 문의처 등은 운영 구조 확정 후 실제 서비스 내용에 맞춰 본 방침에 고지합니다.</p><p>확정되지 않은 개인정보 처리 내용을 임의로 기재하지 않습니다.</p><p><a href="./">← 다시금 홈</a></p>
